# /etc/nginx/sites-available/lubantv.bassamailab.xyz
# The promo site: static files, no backend, no cookies, no logs of visitors' addresses beyond nginx's own.
# Releases live in /var/www/lubantv/releases/<stamp>; "current" is a symlink (install.sh switches it).
# Certbot adds the 443/TLS lines to this file once; do not copy this file over the live one afterwards.

server {
    listen 80;
    server_name lubantv.bassamailab.xyz;

    root  /var/www/lubantv/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/lubantv.access.log;
    error_log  /var/log/nginx/lubantv.error.log warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header is NOT inherited into a location that has its own add_header,
    # so every location includes the same security headers snippet.
    include snippets/lubantv-security-headers.conf;

    # The pages, the stylesheet and the script keep their names between releases: always revalidate.
    location ~ ^/(|en/|index\.html|en/index\.html|assets/site\.(css|js)|version\.json)$ {
        include snippets/lubantv-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Fonts, brand files and screenshots change rarely: a week.
    location /assets/ {
        include snippets/lubantv-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Hidden files are never served.
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
