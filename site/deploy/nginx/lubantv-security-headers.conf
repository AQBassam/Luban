# /etc/nginx/snippets/lubantv-security-headers.conf
# The site loads nothing from anywhere else and sends nothing anywhere: every source is 'self' or nothing at all.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# On since 25 October 2026, after HTTPS had worked for a day. This name only: do not add includeSubDomains.
add_header Strict-Transport-Security "max-age=31536000" always;
