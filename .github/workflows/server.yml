name: Data server image

# Builds server/Dockerfile and checks the container answers /health. Coolify builds the same Dockerfile itself.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t luban-server server
      - run: |
          docker run -d --name s -p 8080:8080 luban-server
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/v1/teams?q=%3Cx%3E')" = 400
          docker exec s id -u | grep -qv '^0$'   # not root
