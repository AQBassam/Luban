name: CI

# test → build → publish. Nothing is built unless every test passes, and nothing is published unless the build is
# signed with Luban's release key. Screen updates go to the canary channel first (promote.yml moves them to stable).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install cryptography==44.0.2 pillow==11.2.1
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: tests/run.sh

  android:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
      - run: python3 web/build.py

      - name: Release key (only on main, only if the secrets exist)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.LUBAN_KEYSTORE_B64 }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "LUBAN_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LUBAN_KEYSTORE_B64 is not set: building with the debug key, nothing will be published"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and lint
        env:
          LUBAN_KEYSTORE_PASSWORD: ${{ secrets.LUBAN_KEYSTORE_PASSWORD }}
        run: |
          cd android && ./gradlew --no-daemon assembleRelease lintRelease
          rm -f "$RUNNER_TEMP/release.p12"   # the key never outlives the build step

      - name: Collect, checksum, and check the signer
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/luban-screen.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk out/luban-home.apk
          (cd out && sha256sum luban-screen.apk luban-home.apk > SHA256SUMS && cat SHA256SUMS)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in out/*.apk; do
            # the setup tool's own parser must agree with apksigner on who signed the APK
            want=$("$apksigner" verify --print-certs "$f" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            got=$(python3 -c "import sys; sys.path.insert(0,'tools'); import luban; print(luban.apk_signer_sha256(open('$f','rb').read()))")
            echo "$f: apksigner $want, luban.py $got"
            [ "$want" = "$got" ] || { echo "::error::tools/luban.py reads the signer differently from apksigner"; exit 1; }
            if [ "${{ steps.key.outputs.signed }}" = true ]; then
              pin=$(python3 -c "import sys; sys.path.insert(0,'tools'); import luban; print(luban.pinned_cert())")
              [ "$got" = "$pin" ] || { echo "::error::signed with a key other than keys/apk-cert.sha256"; exit 1; }
            fi
          done
          cp dist/bundle.zip out/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luban
          path: out/

  publish:
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: luban
          path: out
      - run: pip install cryptography==44.0.2

      - name: Sign the screen bundle
        env:
          LUBAN_UPDATE_KEY: ${{ secrets.LUBAN_UPDATE_KEY }}
        run: |
          [ -n "$LUBAN_UPDATE_KEY" ] || { echo "::error::LUBAN_UPDATE_KEY is not set"; exit 1; }
          mkdir -p dist && cp out/bundle.zip dist/bundle.zip
          python3 tools/sign.py "$N"
          cp dist/manifest.json dist/manifest.sig out/

      - name: Numbered release v1.N
        run: |
          gh release create "v1.$N" out/luban-screen.apk out/luban-home.apk out/SHA256SUMS \
            --title "Luban 1.$N" --notes "Built from ${GITHUB_SHA} by run ${N}." --latest

      - name: apk-latest (fixed download links for the setup tool)
        run: |
          gh release view apk-latest > /dev/null 2>&1 || gh release create apk-latest --title "Latest APKs" --notes "Always the newest build." --latest=false
          gh release upload apk-latest out/luban-screen.apk out/luban-home.apk out/SHA256SUMS --clobber
          gh release edit apk-latest --notes "Luban 1.$N, built from ${GITHUB_SHA}."

      - name: screen-canary (signed screen update, one TV in ten first)
        run: |
          gh release view screen-canary > /dev/null 2>&1 || gh release create screen-canary --title "Screen update: canary" --notes "Signed screen bundles. promote.yml moves them to screen-stable." --prerelease
          gh release upload screen-canary out/bundle.zip out/manifest.json out/manifest.sig --clobber
