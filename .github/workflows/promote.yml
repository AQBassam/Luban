name: Promote screen update

# A screen bundle reaches every TV only after it has run on the canary TVs for two days without being replaced.
# Daily check, or run by hand to promote now.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      now:
        description: Promote even if the canary is younger than 48 hours
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Compare canary and stable
        id: cmp
        run: |
          mkdir c s
          gh release download screen-canary -D c -p 'manifest.json' || { echo "no canary yet"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          gh release download screen-stable -D s -p 'manifest.json' 2>/dev/null || true
          if cmp -s c/manifest.json s/manifest.json; then echo "stable is already the canary"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( $(date +%s) - $(date -d "$(gh release view screen-canary --json assets -q '.assets[] | select(.name=="manifest.json") | .updatedAt')" +%s) ))
          echo "canary age: $((age/3600)) h"
          if [ "${{ inputs.now }}" = true ] || [ "$age" -ge 172800 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Promote
        if: steps.cmp.outputs.go == 'true'
        run: |
          gh release download screen-canary -D p -p 'bundle.zip' -p 'manifest.json' -p 'manifest.sig'
          gh release view screen-stable > /dev/null 2>&1 || gh release create screen-stable --title "Screen update: stable" --notes "Signed screen bundles for every TV." --latest=false
          gh release upload screen-stable p/bundle.zip p/manifest.json p/manifest.sig --clobber
          cat p/manifest.json
