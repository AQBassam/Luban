name: Photos

# Downloads the photos listed in content/photo-picks.json (Unsplash is not reachable from every dev machine) and
# commits them with their credits, then starts CI so the apps carry them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/photo-picks.json', 'tools/photos.py']

permissions:
  contents: write
  actions: write

jobs:
  photos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pillow==11.2.1
      - run: .github/annotate.sh Photos python3 tools/photos.py
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}   # optional
      - run: python3 web/build.py
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos content/photos.json docs/PHOTO-CREDITS.md dist
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Photos from content/photo-picks.json"
          git push
          gh workflow run ci.yml --ref main
