name: Photos

# Downloads the photos listed in content/photo-picks.json (Unsplash is not reachable from every dev machine) and
# commits them with their credits, then starts CI so the apps carry them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/photo-picks.json', 'tools/photos.py']

permissions:
  contents: write
  actions: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pillow==11.2.1
      - run: python3 tools/photos.py
      - run: python3 web/build.py
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos content/photos.json docs/PHOTO-CREDITS.md dist
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Photos from content/photo-picks.json"
          git push
          gh workflow run ci.yml --ref main
