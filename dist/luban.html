:root{
  --luban:#E3B062;      /* frankincense resin */
  --luban-soft:#F2D6A2;
  --om-red:#D52B1E;     /* the three colours of the Omani flag, used as a thin band only */
  --om-green:#1A8F4B;
  --om-white:#F7F4EE;
  --ink:#F7F4EE;
  --ink-2:rgba(247,244,238,.78);
  --ink-3:rgba(247,244,238,.55);
  --glass:rgba(14,20,24,.42);
  --line:rgba(247,244,238,.14);
  --shift-x:0px; --shift-y:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vw / 192);background:#0B1013;color:var(--ink)}
body{font-family:Tajawal,system-ui,sans-serif;width:100vw;height:100vh;overflow:hidden;cursor:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.ltr{direction:ltr}
[hidden]{display:none!important}

/* background: two layers crossfade, a slow drift keeps pixels moving */
#bg,#bg .ph,#bg .veil{position:fixed;inset:0}
#bg{background:radial-gradient(ellipse at 75% 30%,#3A2A17 0%,#1A1712 45%,#0B1013 100%)}
#bg .ph{background-size:cover;background-position:center;opacity:0;transition:opacity 2.5s ease;
  animation:drift 90s ease-in-out infinite alternate}
#bg .ph.on{opacity:1}
#bg .veil{background:
  linear-gradient(to top, rgba(6,9,11,.88) 0%, rgba(6,9,11,.35) 34%, rgba(6,9,11,.10) 55%, rgba(6,9,11,.55) 100%),
  radial-gradient(ellipse at 70% 45%, rgba(6,9,11,0) 0%, rgba(6,9,11,.35) 100%)}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.10) translate(-1.2%,-.8%)}}
body.night #bg .ph{filter:brightness(.55) saturate(.8)}
body.night #stage{opacity:.72}

#stage{position:fixed;inset:0;padding:5.2rem 7.2rem 4.6rem;display:grid;
  grid-template-rows:auto 1fr auto auto;row-gap:2.4rem;transform:translate(var(--shift-x),var(--shift-y));
  transition:opacity 2s, transform 3s ease}

/* top row */
#top{display:flex;align-items:flex-start;justify-content:space-between;gap:3rem}
#place .city{font-size:3.4rem;font-weight:700;letter-spacing:.01em}
#place .wx{margin-top:.6rem;font-size:2.4rem;color:var(--ink-2);display:flex;align-items:center;gap:1rem}
#place .wx svg{width:3.4rem;height:3.4rem}
#place .wx .t{font-weight:700;color:var(--ink)}
#chips{flex:1;display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;padding-top:.6rem}
.chip{font-size:2rem;font-weight:500;padding:.7rem 1.8rem;border-radius:99rem;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
.chip.luban{border-color:rgba(227,176,98,.55);color:var(--luban-soft)}
.chip.nat{background:linear-gradient(90deg,rgba(213,43,30,.35),rgba(26,143,75,.35));border-color:rgba(247,244,238,.35)}
#markets{display:flex;gap:2.6rem;font-size:2rem;color:var(--ink-2)}
.mk{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;min-width:9rem}
body.ltr .mk{align-items:flex-start}
.mk .n{font-size:1.6rem;color:var(--ink-3)}
.mk .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.mk .d{font-size:1.6rem;font-variant-numeric:tabular-nums}
.mk .d.up{color:#7FD99A}.mk .d.down{color:#FF8A7A}

/* centre: clock and the card */
#center{display:flex;align-items:center;justify-content:space-between;gap:6rem;min-height:0}
#clock{font-weight:800;font-size:22rem;line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  direction:ltr;display:flex;align-items:baseline;text-shadow:0 .6rem 3rem rgba(0,0,0,.35)}
#clock .colon{opacity:.75;margin:0 .6rem;transform:translateY(-1.4rem)}
#ampm{font-size:4.2rem;font-weight:500;margin-inline-start:2rem;color:var(--ink-2)}
.crenel{display:block;width:48rem;height:2rem;margin:2.4rem 0 2rem;fill:var(--luban);opacity:.8}
#dates{font-size:3rem;color:var(--ink-2);display:flex;gap:1.4rem;align-items:center}
#dates .dot{color:var(--luban)}
#hijri{color:var(--luban-soft)}

#card{width:62rem;max-height:56rem;padding:3rem 3.4rem;border-radius:2.4rem;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden}
.card-hd{display:flex;align-items:center;gap:1.4rem;font-size:2.2rem;font-weight:700;color:var(--luban-soft);margin-bottom:2rem}
.band{width:5.4rem;height:.6rem;border-radius:.3rem;
  background:linear-gradient(90deg,var(--om-red) 0 33%,var(--om-white) 33% 66%,var(--om-green) 66%)}
#card-body{font-size:2.4rem;line-height:1.55}
#card-body.fade{animation:fade .9s ease}
@keyframes fade{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}
.quote{font-family:Amiri,serif;font-size:3.1rem;line-height:1.9;color:var(--ink)}
.quote.hadith{font-family:Tajawal,sans-serif;font-size:2.5rem;line-height:1.75}
.src{margin-top:1.6rem;font-size:1.9rem;color:var(--ink-3)}
.rows{list-style:none;display:flex;flex-direction:column;gap:1.2rem}
.rows li{display:flex;justify-content:space-between;gap:2rem;align-items:baseline;padding-bottom:1.1rem;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .a{font-weight:500}
.rows .b{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows li.now .a,.rows li.now .b{color:var(--luban)}
.empty{color:var(--ink-3)}

/* prayer bar */
#prayers{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2rem}
.pr{padding:1.8rem 2rem;border-radius:1.8rem;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:.5rem}
.pr .n{font-size:2.2rem;color:var(--ink-2)}
.pr .t{font-size:3.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.pr .c{font-size:1.9rem;color:var(--ink-3);min-height:2.4rem}
.pr.next{background:linear-gradient(160deg,rgba(227,176,98,.32),rgba(227,176,98,.12));border-color:rgba(227,176,98,.7)}
.pr.next .n,.pr.next .c{color:var(--luban-soft)}
.pr.sunrise .t{font-weight:500;color:var(--ink-2)}

#foot{display:flex;justify-content:space-between;align-items:flex-end;gap:3rem;font-size:2rem;color:var(--ink-2)}
#match{display:flex;gap:1.4rem;align-items:center}
#match .vs{color:var(--luban)}
#match .live{color:#FF8A7A;font-weight:700}
#credit{font-size:1.5rem;color:var(--ink-3)}
</style>

 Governorate"},"dakhiliyah":{"ar":"محافظة الداخلية","en":"Ad Dakhiliyah Governorate"},"batinah_north":{"ar":"محافظة شمال الباطنة","en":"North Al Batinah Governorate"},"batinah_south":{"ar":"محافظة جنوب الباطنة","en":"South Al Batinah Governorate"},"sharqiyah_south":{"ar":"محافظة جنوب الشرقية","en":"South Ash Sharqiyah Governorate"},"sharqiyah_north":{"ar":"محافظة شمال الشرقية","en":"North Ash Sharqiyah Governorate"},"dhahirah":{"ar":"محافظة الظاهرة","en":"Ad Dhahirah Governorate"},"wusta":{"ar":"محافظة الوسطى","en":"Al Wusta Governorate"}}},"verses":[{"text":"بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ ﴿1﴾ ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ ﴿2﴾ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ ﴿3﴾ مَٰلِكِ يَوۡمِ ٱلدِّينِ ﴿4﴾ إِيَّاكَ نَعۡبُدُ وَإِيَّاكَ نَسۡتَعِينُ ﴿5﴾ ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ ﴿6﴾ صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ ﴿7﴾","surah":"الفاتحة","ayah":"1–7"},{"text":"فَٱذۡكُرُونِيٓ أَذۡكُرۡكُمۡ وَٱشۡكُرُواْ لِي وَلَا تَكۡفُرُونِ","surah":"البقرة","ayah":152},{"text":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱسۡتَعِينُواْ بِٱلصَّبۡرِ وَٱلصَّلَوٰةِۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","surah":"البقرة","ayah":153},{"text":"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌۖ أُجِيبُ دَعۡوَةَ ٱلدَّاعِ إِذَا دَعَانِۖ فَلۡيَسۡتَجِيبُواْ لِي وَلۡيُؤۡمِنُواْ بِي لَعَلَّهُمۡ يَرۡشُدُونَ","surah":"البقرة","ayah":186},{"text":"وَمِنۡهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِي ٱلدُّنۡيَا حَسَنَةࣰ وَفِي ٱلۡأٓخِرَةِ حَسَنَةࣰ وَقِنَا عَذَابَ ٱلنَّارِ","surah":"البقرة","ayah":201},{"text":"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡحَيُّ ٱلۡقَيُّومُۚ لَا تَأۡخُذُهُۥ سِنَةࣱ وَلَا نَوۡمࣱۚ لَّهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ مَن ذَا ٱلَّذِي يَشۡفَعُ عِندَهُۥٓ إِلَّا بِإِذۡنِهِۦۚ يَعۡلَمُ مَا بَيۡنَ أَيۡدِيهِمۡ وَمَا خَلۡفَهُمۡۖ وَلَا يُحِيطُونَ بِشَيۡءࣲ مِّنۡ عِلۡمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرۡسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۖ وَلَا يَـُٔودُهُۥ حِفۡظُهُمَاۚ وَهُوَ ٱلۡعَلِيُّ ٱلۡعَظِيمُ","surah":"البقرة","ayah":255},{"text":"لَا يُكَلِّفُ ٱللَّهُ نَفۡسًا إِلَّا وُسۡعَهَاۚ لَهَا مَا كَسَبَتۡ وَعَلَيۡهَا مَا ٱكۡتَسَبَتۡۗ رَبَّنَا لَا تُؤَاخِذۡنَآ إِن نَّسِينَآ أَوۡ أَخۡطَأۡنَاۚ رَبَّنَا وَلَا تَحۡمِلۡ عَلَيۡنَآ إِصۡرࣰا كَمَا حَمَلۡتَهُۥ عَلَى ٱلَّذِينَ مِن قَبۡلِنَاۚ رَبَّنَا وَلَا تُحَمِّلۡنَا مَا لَا طَاقَةَ لَنَا بِهِۦۖ وَٱعۡفُ عَنَّا وَٱغۡفِرۡ لَنَا وَٱرۡحَمۡنَآۚ أَنتَ مَوۡلَىٰنَا فَٱنصُرۡنَا عَلَى ٱلۡقَوۡمِ ٱلۡكَٰفِرِينَ","surah":"البقرة","ayah":286},{"text":"رَبَّنَا لَا تُزِغۡ قُلُوبَنَا بَعۡدَ إِذۡ هَدَيۡتَنَا وَهَبۡ لَنَا مِن لَّدُنكَ رَحۡمَةًۚ إِنَّكَ أَنتَ ٱلۡوَهَّابُ","surah":"آل عمران","ayah":8},{"text":"قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلۡمُلۡكِ تُؤۡتِي ٱلۡمُلۡكَ مَن تَشَآءُ وَتَنزِعُ ٱلۡمُلۡكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُۖ بِيَدِكَ ٱلۡخَيۡرُۖ إِنَّكَ عَلَىٰ كُلِّ شَيۡءࣲ قَدِيرࣱ‏","surah":"آل عمران","ayah":26},{"text":"وَلَا تَهِنُواْ وَلَا تَحۡزَنُواْ وَأَنتُمُ ٱلۡأَعۡلَوۡنَ إِن كُنتُم مُّؤۡمِنِينَ","surah":"آل عمران","ayah":139},{"text":"ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدۡ جَمَعُواْ لَكُمۡ فَٱخۡشَوۡهُمۡ فَزَادَهُمۡ إِيمَٰنࣰا وَقَالُواْ حَسۡبُنَا ٱللَّهُ وَنِعۡمَ ٱلۡوَكِيلُ","surah":"آل عمران","ayah":173},{"text":"إِنَّ فِي خَلۡقِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَٱخۡتِلَٰفِ ٱلَّيۡلِ وَٱلنَّهَارِ لَأٓيَٰتࣲ لِّأُوْلِي ٱلۡأَلۡبَٰبِ ﴿190﴾ ٱلَّذِينَ يَذۡكُرُونَ ٱللَّهَ قِيَٰمࣰا وَقُعُودࣰا وَعَلَىٰ جُنُوبِهِمۡ وَيَتَفَكَّرُونَ فِي خَلۡقِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ رَبَّنَا مَا خَلَقۡتَ هَٰذَا بَٰطِلࣰا سُبۡحَٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ ﴿191﴾","surah":"آل عمران","ayah":"190–191"},{"text":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱصۡبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُفۡلِحُونَ","surah":"آل عمران","ayah":200},{"text":"قُلۡ إِنَّ صَلَاتِي وَنُسُكِي وَمَحۡيَايَ وَمَمَاتِي لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ ﴿162﴾ لَا شَرِيكَ لَهُۥۖ وَبِذَٰلِكَ أُمِرۡتُ وَأَنَا۠ أَوَّلُ ٱلۡمُسۡلِمِينَ ﴿163﴾","surah":"الأنعام","ayah":"162–163"},{"text":"قَالَا رَبَّنَا ظَلَمۡنَآ أَنفُسَنَا وَإِن لَّمۡ تَغۡفِرۡ لَنَا وَتَرۡحَمۡنَا لَنَكُونَنَّ مِنَ ٱلۡخَٰسِرِينَ","surah":"الأعراف","ayah":23},{"text":"قُل لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوۡلَىٰنَاۚ وَعَلَى ٱللَّهِ فَلۡيَتَوَكَّلِ ٱلۡمُؤۡمِنُونَ","surah":"التوبة","ayah":51},{"text":"قَالَ يَٰقَوۡمِ أَرَءَيۡتُمۡ إِن كُنتُ عَلَىٰ بَيِّنَةࣲ مِّن رَّبِّي وَرَزَقَنِي مِنۡهُ رِزۡقًا حَسَنࣰاۚ وَمَآ أُرِيدُ أَنۡ أُخَالِفَكُمۡ إِلَىٰ مَآ أَنۡهَىٰكُمۡ عَنۡهُۚ إِنۡ أُرِيدُ إِلَّا ٱلۡإِصۡلَٰحَ مَا ٱسۡتَطَعۡتُۚ وَمَا تَوۡفِيقِيٓ إِلَّا بِٱللَّهِۚ عَلَيۡهِ تَوَكَّلۡتُ وَإِلَيۡهِ أُنِيبُ","surah":"هود","ayah":88},{"text":"يَٰبَنِيَّ ٱذۡهَبُواْ فَتَحَسَّسُواْ مِن يُوسُفَ وَأَخِيهِ وَلَا تَاْيۡـَٔسُواْ مِن رَّوۡحِ ٱللَّهِۖ إِنَّهُۥ لَا يَاْيۡـَٔسُ مِن رَّوۡحِ ٱللَّهِ إِلَّا ٱلۡقَوۡمُ ٱلۡكَٰفِرُونَ","surah":"يوسف","ayah":87},{"text":"۞رَبِّ قَدۡ ءَاتَيۡتَنِي مِنَ ٱلۡمُلۡكِ وَعَلَّمۡتَنِي مِن تَأۡوِيلِ ٱلۡأَحَادِيثِۚ فَاطِرَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ أَنتَ وَلِيِّۦ فِي ٱلدُّنۡيَا وَٱلۡأٓخِرَةِۖ تَوَفَّنِي مُسۡلِمࣰا وَأَلۡحِقۡنِي بِٱلصَّٰلِحِينَ","surah":"يوسف","ayah":101},{"text":"ٱلَّذِينَ ءَامَنُواْ وَتَطۡمَئِنُّ قُلُوبُهُم بِذِكۡرِ ٱللَّهِۗ أَلَا بِذِكۡرِ ٱللَّهِ تَطۡمَئِنُّ ٱلۡقُلُوبُ","surah":"الرعد","ayah":28},{"text":"وَإِذۡ تَأَذَّنَ رَبُّكُمۡ لَئِن شَكَرۡتُمۡ لَأَزِيدَنَّكُمۡۖ وَلَئِن كَفَرۡتُمۡ إِنَّ عَذَابِي لَشَدِيدࣱ‏","surah":"إبراهيم","ayah":7},{"text":"رَبِّ ٱجۡعَلۡنِي مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِيۚ رَبَّنَا وَتَقَبَّلۡ دُعَآءِ ﴿40﴾ رَبَّنَا ٱغۡفِرۡ لِي وَلِوَٰلِدَيَّ وَلِلۡمُؤۡمِنِينَ يَوۡمَ يَقُومُ ٱلۡحِسَابُ ﴿41﴾","surah":"إبراهيم","ayah":"40–41"},{"text":"مَنۡ عَمِلَ صَٰلِحࣰا مِّن ذَكَرٍ أَوۡ أُنثَىٰ وَهُوَ مُؤۡمِنࣱ فَلَنُحۡيِيَنَّهُۥ حَيَوٰةࣰ طَيِّبَةࣰۖ وَلَنَجۡزِيَنَّهُمۡ أَجۡرَهُم بِأَحۡسَنِ مَا كَانُواْ يَعۡمَلُونَ","surah":"النحل","ayah":97},{"text":"إِنَّ ٱللَّهَ مَعَ ٱلَّذِينَ ٱتَّقَواْ وَّٱلَّذِينَ هُم مُّحۡسِنُونَ","surah":"النحل","ayah":128},{"text":"۞وَقَضَىٰ رَبُّكَ أَلَّا تَعۡبُدُوٓاْ إِلَّآ إِيَّاهُ وَبِٱلۡوَٰلِدَيۡنِ إِحۡسَٰنًاۚ إِمَّا يَبۡلُغَنَّ عِندَكَ ٱلۡكِبَرَ أَحَدُهُمَآ أَوۡ كِلَاهُمَا فَلَا تَقُل لَّهُمَآ أُفࣲّ وَلَا تَنۡهَرۡهُمَا وَقُل لَّهُمَا قَوۡلࣰا كَرِيمࣰا","surah":"الإسراء","ayah":23},{"text":"وَٱخۡفِضۡ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحۡمَةِ وَقُل رَّبِّ ٱرۡحَمۡهُمَا كَمَا رَبَّيَانِي صَغِيرࣰا","surah":"الإسراء","ayah":24},{"text":"وَقُل رَّبِّ أَدۡخِلۡنِي مُدۡخَلَ صِدۡقࣲ وَأَخۡرِجۡنِي مُخۡرَجَ صِدۡقࣲ وَٱجۡعَل لِّي مِن لَّدُنكَ سُلۡطَٰنࣰا نَّصِيرࣰا","surah":"الإسراء","ayah":80},{"text":"إِذۡ أَوَى ٱلۡفِتۡيَةُ إِلَى ٱلۡكَهۡفِ فَقَالُواْ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحۡمَةࣰ وَهَيِّئۡ لَنَا مِنۡ أَمۡرِنَا رَشَدࣰا","surah":"الكهف","ayah":10},{"text":"ٱلۡمَالُ وَٱلۡبَنُونَ زِينَةُ ٱلۡحَيَوٰةِ ٱلدُّنۡيَاۖ وَٱلۡبَٰقِيَٰتُ ٱلصَّٰلِحَٰتُ خَيۡرٌ عِندَ رَبِّكَ ثَوَابࣰا وَخَيۡرٌ أَمَلࣰا","surah":"الكهف","ayah":46},{"text":"قَالَ رَبِّ ٱشۡرَحۡ لِي صَدۡرِي ﴿25﴾ وَيَسِّرۡ لِيٓ أَمۡرِي ﴿26﴾ وَٱحۡلُلۡ عُقۡدَةࣰ مِّن لِّسَانِي ﴿27﴾ يَفۡقَهُواْ قَوۡلِي ﴿28﴾","surah":"طه","ayah":"25–28"},{"text":"فَتَعَٰلَى ٱللَّهُ ٱلۡمَلِكُ ٱلۡحَقُّۗ وَلَا تَعۡجَلۡ بِٱلۡقُرۡءَانِ مِن قَبۡلِ أَن يُقۡضَىٰٓ إِلَيۡكَ وَحۡيُهُۥۖ وَقُل رَّبِّ زِدۡنِي عِلۡمࣰا","surah":"طه","ayah":114},{"text":"وَذَا ٱلنُّونِ إِذ ذَّهَبَ مُغَٰضِبࣰا فَظَنَّ أَن لَّن نَّقۡدِرَ عَلَيۡهِ فَنَادَىٰ فِي ٱلظُّلُمَٰتِ أَن لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبۡحَٰنَكَ إِنِّي كُنتُ مِنَ ٱلظَّٰلِمِينَ","surah":"الأنبياء","ayah":87},{"text":"وَزَكَرِيَّآ إِذۡ نَادَىٰ رَبَّهُۥ رَبِّ لَا تَذَرۡنِي فَرۡدࣰا وَأَنتَ خَيۡرُ ٱلۡوَٰرِثِينَ","surah":"الأنبياء","ayah":89},{"text":"وَقُل رَّبِّ ٱغۡفِرۡ وَٱرۡحَمۡ وَأَنتَ خَيۡرُ ٱلرَّٰحِمِينَ","surah":"المؤمنون","ayah":118},{"text":"وَعِبَادُ ٱلرَّحۡمَٰنِ ٱلَّذِينَ يَمۡشُونَ عَلَى ٱلۡأَرۡضِ هَوۡنࣰا وَإِذَا خَاطَبَهُمُ ٱلۡجَٰهِلُونَ قَالُواْ سَلَٰمࣰا","surah":"الفرقان","ayah":63},{"text":"وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبۡ لَنَا مِنۡ أَزۡوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعۡيُنࣲ وَٱجۡعَلۡنَا لِلۡمُتَّقِينَ إِمَامًا","surah":"الفرقان","ayah":74},{"text":"فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَآ أَنزَلۡتَ إِلَيَّ مِنۡ خَيۡرࣲ فَقِيرࣱ‏","surah":"القصص","ayah":24},{"text":"وَٱلَّذِينَ جَٰهَدُواْ فِينَا لَنَهۡدِيَنَّهُمۡ سُبُلَنَاۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلۡمُحۡسِنِينَ","surah":"العنكبوت","ayah":69},{"text":"يَٰبُنَيَّ أَقِمِ ٱلصَّلَوٰةَ وَأۡمُرۡ بِٱلۡمَعۡرُوفِ وَٱنۡهَ عَنِ ٱلۡمُنكَرِ وَٱصۡبِرۡ عَلَىٰ مَآ أَصَابَكَۖ إِنَّ ذَٰلِكَ مِنۡ عَزۡمِ ٱلۡأُمُورِ","surah":"لقمان","ayah":17},{"text":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱذۡكُرُواْ ٱللَّهَ ذِكۡرࣰا كَثِيرࣰا ﴿41﴾ وَسَبِّحُوهُ بُكۡرَةࣰ وَأَصِيلًا ﴿42﴾","surah":"الأحزاب","ayah":"41–42"},{"text":"قُلۡ يَٰعِبَادِ ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ رَبَّكُمۡۚ لِلَّذِينَ أَحۡسَنُواْ فِي هَٰذِهِ ٱلدُّنۡيَا حَسَنَةࣱۗ وَأَرۡضُ ٱللَّهِ وَٰسِعَةٌۗ إِنَّمَا يُوَفَّى ٱلصَّٰبِرُونَ أَجۡرَهُم بِغَيۡرِ حِسَابࣲ‏","surah":"الزمر","ayah":10},{"text":"۞قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ","surah":"الزمر","ayah":53},{"text":"فَسَتَذۡكُرُونَ مَآ أَقُولُ لَكُمۡۚ وَأُفَوِّضُ أَمۡرِيٓ إِلَى ٱللَّهِۚ إِنَّ ٱللَّهَ بَصِيرُۢ بِٱلۡعِبَادِ","surah":"غافر","ayah":44},{"text":"وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ","surah":"غافر","ayah":60},{"text":"وَلَا تَسۡتَوِي ٱلۡحَسَنَةُ وَلَا ٱلسَّيِّئَةُۚ ٱدۡفَعۡ بِٱلَّتِي هِيَ أَحۡسَنُ فَإِذَا ٱلَّذِي بَيۡنَكَ وَبَيۡنَهُۥ عَدَٰوَةࣱ كَأَنَّهُۥ وَلِيٌّ حَمِيمࣱ‏","surah":"فصلت","ayah":34},{"text":"ٱللَّهُ لَطِيفُۢ بِعِبَادِهِۦ يَرۡزُقُ مَن يَشَآءُۖ وَهُوَ ٱلۡقَوِيُّ ٱلۡعَزِيزُ","surah":"الشورى","ayah":19},{"text":"إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةࣱ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ","surah":"الحجرات","ayah":10},{"text":"يَٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرࣲ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبࣰا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرࣱ‏","surah":"الحجرات","ayah":13},{"text":"ٱلرَّحۡمَٰنُ ﴿1﴾ عَلَّمَ ٱلۡقُرۡءَانَ ﴿2﴾ خَلَقَ ٱلۡإِنسَٰنَ ﴿3﴾ عَلَّمَهُ ٱلۡبَيَانَ ﴿4﴾","surah":"الرحمن","ayah":"1–4"},{"text":"هَلۡ جَزَآءُ ٱلۡإِحۡسَٰنِ إِلَّا ٱلۡإِحۡسَٰنُ","surah":"الرحمن","ayah":60},{"text":"وَٱلَّذِينَ جَآءُو مِنۢ بَعۡدِهِمۡ يَقُولُونَ رَبَّنَا ٱغۡفِرۡ لَنَا وَلِإِخۡوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلۡإِيمَٰنِ وَلَا تَجۡعَلۡ فِي قُلُوبِنَا غِلࣰّا لِّلَّذِينَ ءَامَنُواْ رَبَّنَآ إِنَّكَ رَءُوفࣱ رَّحِيمٌ","surah":"الحشر","ayah":10},{"text":"فَٱتَّقُواْ ٱللَّهَ مَا ٱسۡتَطَعۡتُمۡ وَٱسۡمَعُواْ وَأَطِيعُواْ وَأَنفِقُواْ خَيۡرࣰا لِّأَنفُسِكُمۡۗ وَمَن يُوقَ شُحَّ نَفۡسِهِۦ فَأُوْلَٰٓئِكَ هُمُ ٱلۡمُفۡلِحُونَ","surah":"التغابن","ayah":16},{"text":"تَبَٰرَكَ ٱلَّذِي بِيَدِهِ ٱلۡمُلۡكُ وَهُوَ عَلَىٰ كُلِّ شَيۡءࣲ قَدِيرٌ ﴿1﴾ ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلࣰاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ ﴿2﴾","surah":"الملك","ayah":"1–2"},{"text":"سَبِّحِ ٱسۡمَ رَبِّكَ ٱلۡأَعۡلَى ﴿1﴾ ٱلَّذِي خَلَقَ فَسَوَّىٰ ﴿2﴾ وَٱلَّذِي قَدَّرَ فَهَدَىٰ ﴿3﴾","surah":"الأعلى","ayah":"1–3"},{"text":"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ ﴿3﴾ وَلَلۡأٓخِرَةُ خَيۡرࣱ لَّكَ مِنَ ٱلۡأُولَىٰ ﴿4﴾ وَلَسَوۡفَ يُعۡطِيكَ رَبُّكَ فَتَرۡضَىٰٓ ﴿5﴾","surah":"الضحى","ayah":"3–5"},{"text":"فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا ﴿5﴾ إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرࣰا ﴿6﴾ فَإِذَا فَرَغۡتَ فَٱنصَبۡ ﴿7﴾ وَإِلَىٰ رَبِّكَ فَٱرۡغَب ﴿8﴾","surah":"الشرح","ayah":"5–8"},{"text":"إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ ﴿1﴾ وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ ﴿2﴾ لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرࣱ مِّنۡ أَلۡفِ شَهۡرࣲ‏ ﴿3﴾ تَنَزَّلُ ٱلۡمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرࣲ‏ ﴿4﴾ سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ ﴿5﴾","surah":"القدر","ayah":"1–5"},{"text":"وَٱلۡعَصۡرِ ﴿1﴾ إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ ﴿2﴾ إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ ﴿3﴾","surah":"العصر","ayah":"1–3"},{"text":"إِنَّآ أَعۡطَيۡنَٰكَ ٱلۡكَوۡثَرَ ﴿1﴾ فَصَلِّ لِرَبِّكَ وَٱنۡحَرۡ ﴿2﴾ إِنَّ شَانِئَكَ هُوَ ٱلۡأَبۡتَرُ ﴿3﴾","surah":"الكوثر","ayah":"1–3"},{"text":"إِذَا جَآءَ نَصۡرُ ٱللَّهِ وَٱلۡفَتۡحُ ﴿1﴾ وَرَأَيۡتَ ٱلنَّاسَ يَدۡخُلُونَ فِي دِينِ ٱللَّهِ أَفۡوَاجࣰا ﴿2﴾ فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا ﴿3﴾","surah":"النصر","ayah":"1–3"},{"text":"قُلۡ هُوَ ٱللَّهُ أَحَدٌ ﴿1﴾ ٱللَّهُ ٱلصَّمَدُ ﴿2﴾ لَمۡ يَلِدۡ وَلَمۡ يُولَدۡ ﴿3﴾ وَلَمۡ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ ﴿4﴾","surah":"الإخلاص","ayah":"1–4"},{"text":"قُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ ﴿1﴾ مِن شَرِّ مَا خَلَقَ ﴿2﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿3﴾ وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِي ٱلۡعُقَدِ ﴿4﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿5﴾","surah":"الفلق","ayah":"1–5"},{"text":"قُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ ﴿1﴾ مَلِكِ ٱلنَّاسِ ﴿2﴾ إِلَٰهِ ٱلنَّاسِ ﴿3﴾ مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ ﴿4﴾ ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ ﴿5﴾ مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ ﴿6﴾","surah":"الناس","ayah":"1–6"}],"hadith":[{"text":"عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللَّهِ بْنِ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إلَهَ إلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ . [رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]","source":"الأربعون النووية، الحديث 3"},{"text":"عَنْ أُمِّ الْمُؤْمِنِينَ أُمِّ عَبْدِ اللَّهِ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا، قَالَتْ: قَالَ: رَسُولُ اللَّهِ صلى الله عليه و سلم مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ [رَوَاهُ الْبُخَارِيُّ] ،[وَمُسْلِمٌ] وَفِي رِوَايَةٍ لِمُسْلِمٍ: مَنْ عَمِلَ عَمَلًا لَيْسَ عَلَيْهِ أَمْرُنَا فَهُوَ رَدٌّ","source":"الأربعون النووية، الحديث 5"},{"text":"عَنْ أَبِي رُقَيَّةَ تَمِيمِ بْنِ أَوْسٍ الدَّارِيِّ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ: \"الدِّينُ النَّصِيحَةُ.\" قُلْنَا: لِمَنْ؟ قَالَ: \"لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ.\" [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 7"},{"text":"عَنْ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا، أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إلَهَ إلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَيُقِيمُوا الصَّلَاةَ، وَيُؤْتُوا الزَّكَاةَ؛ فَإِذَا فَعَلُوا ذَلِكَ عَصَمُوا مِنِّي دِمَاءَهُمْ وَأَمْوَالَهُمْ إلَّا بِحَقِّ الْإِسْلَامِ، وَحِسَابُهُمْ عَلَى اللَّهِ تَعَالَى .<br>[رَوَاهُ الْبُخَارِيُّ] ،[وَمُسْلِمٌ]","source":"الأربعون النووية، الحديث 8"},{"text":"عَنْ أَبِي هُرَيْرَةَ عَبْدِ الرَّحْمَنِ بْنِ صَخْرٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ، فَإِنَّمَا أَهْلَكَ الَّذِينَ مِنْ قَبْلِكُمْ كَثْرَةُ مَسَائِلِهِمْ وَاخْتِلَافُهُمْ عَلَى أَنْبِيَائِهِمْ .<br>[رَوَاهُ الْبُخَارِيُّ] ،[وَمُسْلِمٌ]","source":"الأربعون النووية، الحديث 9"},{"text":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم \"إنَّ اللَّهَ طَيِّبٌ لَا يَقْبَلُ إلَّا طَيِّبًا، وَإِنَّ اللَّهَ أَمَرَ الْمُؤْمِنِينَ بِمَا أَمَرَ بِهِ الْمُرْسَلِينَ فَقَالَ تَعَالَى: \"يَا أَيُّهَا الرُّسُلُ كُلُوا مِنْ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا\"، وَقَالَ تَعَالَى: \"يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ\" ثُمَّ ذَكَرَ الرَّجُلَ يُطِيلُ السَّفَرَ أَشْعَثَ أَغْبَرَ يَمُدُّ يَدَيْهِ إلَى السَّمَاءِ: يَا رَبِّ! يَا رَبِّ! وَمَطْعَمُهُ حَرَامٌ، وَمَشْرَبُهُ حَرَامٌ، وَمَلْبَسُهُ حَرَامٌ، وَغُذِّيَ بِالْحَرَامِ، فَأَنَّى يُسْتَجَابُ لَهُ؟\". [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 10"},{"text":"عَنْ أَبِي مُحَمَّدٍ الْحَسَنِ بْنِ عَلِيِّ بْنِ أَبِي طَالِبٍ سِبْطِ رَسُولِ اللَّهِ صلى الله عليه و سلم وَرَيْحَانَتِهِ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: حَفِظْت مِنْ رَسُولِ اللَّهِ صلى الله عليه و سلم دَعْ مَا يُرِيبُك إلَى مَا لَا يُرِيبُك . رَوَاهُ التِّرْمِذِيُّ [رقم:2520]، [وَالنَّسَائِيّ] وَقَالَ التِّرْمِذِيُّ: حَدِيثٌ حَسَنٌ صَحِيحٌ","source":"الأربعون النووية، الحديث 11"},{"text":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم مِنْ حُسْنِ إسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ . حَدِيثٌ حَسَنٌ، رَوَاهُ التِّرْمِذِيُّ [رقم: 2318] ، ابن ماجه [رقم:]","source":"الأربعون النووية، الحديث 12"},{"text":"عَنْ أَبِي حَمْزَةَ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ خَادِمِ رَسُولِ اللَّهِ صلى الله عليه و سلم عَنْ النَّبِيِّ صلى الله عليه و سلم قَالَ: لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ . رَوَاهُ الْبُخَارِيُّ [رقم:13]، وَمُسْلِمٌ [رقم:45].<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]","source":"الأربعون النووية، الحديث 13"},{"text":"عَنْ ابْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ [ يشهد أن لا إله إلا الله، وأني رسول الله] إلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ الْمُفَارِقُ لِلْجَمَاعَةِ .<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]","source":"الأربعون النووية، الحديث 14"},{"text":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: مَنْ كَانَ يُؤْمِنُ بِاَللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ، وَمَنْ كَانَ يُؤْمِنُ بِاَللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاَللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ .<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]","source":"الأربعون النووية، الحديث 15"},{"text":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ صلى الله عليه و سلم أَوْصِنِي. قَالَ: لَا تَغْضَبْ، فَرَدَّدَ مِرَارًا، قَالَ: لَا تَغْضَبْ\" .<br>[رَوَاهُ الْبُخَارِيُّ]","source":"الأربعون النووية، الحديث 16"},{"text":"عَنْ أَبِي يَعْلَى شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم قَالَ: إنَّ اللَّهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذِّبْحَةَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، وَلْيُرِحْ ذَبِيحَتَهُ . [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 17"},{"text":"عَنْ أَبِي ذَرٍّ جُنْدَبِ بْنِ جُنَادَةَ، وَأَبِي عَبْدِ الرَّحْمَنِ مُعَاذِ بْنِ جَبَلٍ رَضِيَ اللَّهُ عَنْهُمَا، عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم قَالَ: اتَّقِ اللَّهَ حَيْثُمَا كُنْت، وَأَتْبِعْ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقْ النَّاسَ بِخُلُقٍ حَسَنٍ . رَوَاهُ التِّرْمِذِيُّ [رقم:1987] وَقَالَ: حَدِيثٌ حَسَنٌ، وَفِي بَعْضِ النُّسَخِ: حَسَنٌ صَحِيحٌ","source":"الأربعون النووية، الحديث 18"},{"text":"عَنْ أَبِي مَسْعُودٍ عُقْبَةَ بْنِ عَمْرٍو الْأَنْصَارِيِّ الْبَدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم إنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلَامِ النُّبُوَّةِ الْأُولَى: إذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْت .<br>[رَوَاهُ الْبُخَارِيُّ]","source":"الأربعون النووية، الحديث 20"},{"text":"عَنْ أَبِي عَمْرٍو وَقِيلَ: أَبِي عَمْرَةَ سُفْيَانَ بْنِ عَبْدِ اللَّهِ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْت: يَا رَسُولَ اللَّهِ! قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَك؛ قَالَ: قُلْ: آمَنْت بِاَللَّهِ ثُمَّ اسْتَقِمْ . [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 21"},{"text":"عَنْ أَبِي عَبْدِ اللَّهِ جَابِرِ بْنِ عَبْدِ اللَّهِ الْأَنْصَارِيِّ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَجُلًا سَأَلَ رَسُولَ اللَّهِ صلى الله عليه و سلم فَقَالَ: أَرَأَيْت إذَا صَلَّيْت الْمَكْتُوبَاتِ، وَصُمْت رَمَضَانَ، وَأَحْلَلْت الْحَلَالَ، وَحَرَّمْت الْحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا؛ أَأَدْخُلُ الْجَنَّةَ؟ قَالَ: نَعَمْ . [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 22"},{"text":"عَنْ أَبِي مَالِكٍ الْحَارِثِ بْنِ عَاصِمٍ الْأَشْعَرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم الطَّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلَآنِ -أَوْ: تَمْلَأُ- مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَك أَوْ عَلَيْك، كُلُّ النَّاسِ يَغْدُو، فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا . [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 23"},{"text":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم كُلُّ سُلَامَى مِنْ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِي دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خُطْوَةٍ تَمْشِيهَا إلَى الصَّلَاةِ صَدَقَةٌ، وَتُمِيطُ الْأَذَى عَنْ الطَّرِيقِ صَدَقَةٌ .<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]","source":"الأربعون النووية، الحديث 26"},{"text":"عَنْ أَبِي نَجِيحٍ الْعِرْبَاضِ بْنِ سَارِيَةَ رَضِيَ اللهُ عَنْهُ قَالَ: وَعَظَنَا رَسُولُ اللَّهِ صلى الله عليه و سلم مَوْعِظَةً وَجِلَتْ مِنْهَا الْقُلُوبُ، وَذَرَفَتْ مِنْهَا الْعُيُونُ، فَقُلْنَا: يَا رَسُولَ اللَّهِ! كَأَنَّهَا مَوْعِظَةُ مُوَدِّعٍ فَأَوْصِنَا، قَالَ: أُوصِيكُمْ بِتَقْوَى اللَّهِ، وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ فَسَيَرَى اخْتِلَافًا كَثِيرًا، فَعَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ الْمَهْدِيينَ، عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ؛ فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ . [رَوَاهُ أَبُو دَاوُدَ]، وَاَلتِّرْمِذِيُّ [رقم:266] وَقَالَ: حَدِيثٌ حَسَنٌ صَحِيحٌ","source":"الأربعون النووية، الحديث 28"},{"text":"عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ جُرْثُومِ بن نَاشِر رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم قَال: \"إنَّ اللَّهَ تَعَالَى فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ غَيْرَ نِسْيَانٍ فَلَا تَبْحَثُوا عَنْهَا\". حَدِيثٌ حَسَنٌ، رَوَاهُ الدَّارَقُطْنِيّ ْ\"في سننه\" [4/184]، وَغَيْرُهُ","source":"الأربعون النووية، الحديث 30"},{"text":"عَنْ أَبِي الْعَبَّاسِ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيّ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إلَى النَّبِيِّ صلى الله عليه و سلم فَقَالَ: يَا رَسُولَ اللهِ! دُلَّنِي عَلَى عَمَلٍ إذَا عَمِلْتُهُ أَحَبَّنِي اللهُ وَأَحَبَّنِي النَّاسُ؛ فَقَالَ: ازْهَدْ فِي الدُّنْيَا يُحِبَّك اللهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّك النَّاسُ . حديث حسن، رَوَاهُ ابْنُ مَاجَهْ [رقم:4102]، وَغَيْرُهُ بِأَسَانِيدَ حَسَنَةٍ","source":"الأربعون النووية، الحديث 31"},{"text":"عَنْ أَبِي سَعِيدٍ سَعْدِ بْنِ مَالِكِ بْنِ سِنَانٍ الْخُدْرِيّ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: \" لَا ضَرَرَ وَلَا ضِرَارَ\" . حَدِيثٌ حَسَنٌ، رَوَاهُ ابْنُ مَاجَهْ [راجع رقم:2341]، وَالدَّارَقُطْنِيّ [رقم:4/228]، وَغَيْرُهُمَا مُسْنَدًا. وَرَوَاهُ مَالِكٌ [2/746] فِي \"الْمُوَطَّإِ\" عَنْ عَمْرِو بْنِ يَحْيَى عَنْ أَبِيهِ عَنْ النَّبِيِّ صلى الله عليه و سلم مُرْسَلًا، فَأَسْقَطَ أَبَا سَعِيدٍ، وَلَهُ طُرُقٌ يُقَوِّي بَعْضُهَا بَعْضًا","source":"الأربعون النووية، الحديث 32"},{"text":"عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: \"لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ لَادَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، لَكِنَّ الْبَيِّنَةَ عَلَى الْمُدَّعِي، وَالْيَمِينَ عَلَى مَنْ أَنْكَرَ\" . حَدِيثٌ حَسَنٌ، رَوَاهُ الْبَيْهَقِيّ [في\"السنن\" 10/252]، وَغَيْرُهُ هَكَذَا، وَبَعْضُهُ فِي \"الصَّحِيحَيْنِ","source":"الأربعون النووية، الحديث 33"},{"text":"عَنْ أَبِي سَعِيدٍ الْخُدْرِيّ رَضِيَ اللهُ عَنْهُ قَالَ سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الْإِيمَانِ . [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 34"},{"text":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا، وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللَّهِ إخْوَانًا، الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ، وَلَا يَخْذُلُهُ، وَلَا يَكْذِبُهُ، وَلَا يَحْقِرُهُ، التَّقْوَى هَاهُنَا، وَيُشِيرُ إلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ، بِحَسْبِ امْرِئٍ مِنْ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ الْمُسْلِمَ، كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ: دَمُهُ وَمَالُهُ وَعِرْضُهُ . [رَوَاهُ مُسْلِمٌ]","source":"الأربعون النووية، الحديث 35"},{"text":"عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، قَالَ: \"إنَّ اللَّهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ، ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ عِنْدَهُ عَشْرَ حَسَنَاتٍ إلَى سَبْعِمِائَةِ ضِعْفٍ إلَى أَضْعَافٍ كَثِيرَةٍ، وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ سَيِّئَةً وَاحِدَةً\".<br>[رَوَاهُ الْبُخَارِيُّ] ، [وَمُسْلِمٌ]، في \"صحيحيهما\" بهذه الحروف","source":"الأربعون النووية، الحديث 37"},{"text":"عَنْ أَبِي هُرَيْرَة رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُول اللَّهِ صلى الله عليه و سلم إنَّ اللَّهَ تَعَالَى قَالَ: مَنْ عَادَى لِي وَلِيًّا فَقْد آذَنْتهُ بِالْحَرْبِ، وَمَا تَقَرَّبَ إلَيَّ عَبْدِي بِشَيْءٍ أَحَبَّ إلَيَّ مِمَّا افْتَرَضْتُهُ عَلَيْهِ، وَلَا يَزَالُ عَبْدِي يَتَقَرَّبُ إلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ كُنْت سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ، وَيَدَهُ الَّتِي يَبْطِشُ بِهَا، وَرِجْلَهُ الَّتِي يَمْشِي بِهَا، وَلَئِنْ سَأَلَنِي لَأُعْطِيَنَّهُ، وَلَئِنْ اسْتَعَاذَنِي لَأُعِيذَنَّهُ . [رَوَاهُ الْبُخَارِيُّ]","source":"الأربعون النووية، الحديث 38"},{"text":"عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: \"إنَّ اللَّهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ\" . حَدِيثٌ حَسَنٌ، رَوَاهُ ابْنُ مَاجَهْ [رقم:2045]، وَالْبَيْهَقِيّ [\"السنن]","source":"الأربعون النووية، الحديث 39"},{"text":"عَنْ ابْن عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: أَخَذَ رَسُولُ اللَّهِ صلى الله عليه و سلم بِمَنْكِبِي، وَقَالَ: كُنْ فِي الدُّنْيَا كَأَنَّك غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ . وَكَانَ ابْنُ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا يَقُولُ: إذَا أَمْسَيْتَ فَلَا تَنْتَظِرْ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلَا تَنْتَظِرْ الْمَسَاءَ، وَخُذْ مِنْ صِحَّتِك لِمَرَضِك، وَمِنْ حَيَاتِك لِمَوْتِك. [رَوَاهُ الْبُخَارِيُّ]","source":"الأربعون النووية، الحديث 40"},{"text":"عَنْ أَبِي مُحَمَّدٍ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم \"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يَكُونَ هَوَاهُ تَبَعًا لِمَا جِئْتُ بِهِ\". حَدِيثٌ حَسَنٌ صَحِيحٌ، رَوَيْنَاهُ فِي كِتَابِ \"الْحُجَّةِ\" بِإِسْنَادٍ صَحِيحٍ","source":"الأربعون النووية، الحديث 41"},{"text":"عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: قَالَ اللَّهُ تَعَالَى: يَا ابْنَ آدَمَ! إِنَّكَ مَا دَعَوْتنِي وَرَجَوْتنِي غَفَرْتُ لَك عَلَى مَا كَانَ مِنْك وَلَا أُبَالِي، يَا ابْنَ آدَمَ! لَوْ بَلَغَتْ ذُنُوبُك عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتنِي غَفَرْتُ لَك، يَا ابْنَ آدَمَ! إنَّك لَوْ أتَيْتنِي بِقُرَابِ الْأَرْضِ خَطَايَا ثُمَّ لَقِيتنِي لَا تُشْرِكُ بِي شَيْئًا لَأَتَيْتُك بِقُرَابِهَا مَغْفِرَةً . رَوَاهُ التِّرْمِذِيُّ [رقم:3540]، وَقَالَ: حَدِيثٌ حَسَنٌ صَحِيحٌ","source":"الأربعون النووية، الحديث 42"}],"photos":[{"f":"c33951438.jpg","by":"DXR","licence":"CC BY-SA 3.0","link":"https://commons.wikimedia.org/wiki/File:Costa_Victoria_in_Port_Sultan_Qaboos,_Muscat,_Oman_20120408_1.jpg","place_ar":"مسقط","place_en":"Muscat"},{"f":"c151778540.jpg","by":"Diego Delso","licence":"CC BY-SA 4.0","link":"https://commons.wikimedia.org/wiki/File:Avenida_del_palacio_de_Al_Alam,_Mascate,_Om%C3%A1n,_2024-08-14,_DD_31.jpg","place_ar":"مسقط","place_en":"Muscat"},{"f":"c151778577.jp         } else if (IN_APP) {
          const j = await getJSON(net(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(m.yahoo)}?range=5d&interval=1d`));
          const meta = j.chart.result[0].meta, prev = meta.chartPreviousClose || meta.previousClose;
          got[id] = { price: meta.regularMarketPrice, change: prev ? (meta.regularMarketPrice / prev - 1) * 100 : null };
        }
      } catch (e) { /* keep the last value */ }
    }));
    for (const k of Object.keys(got)) if (got[k] && isFinite(got[k].price)) state.markets[k] = got[k];
    store.set('markets', state.markets);
    renderMarkets();
  }
  function renderMarkets() {
    const box = clear($('markets'));
    for (const id of S.markets) {
      const q = state.markets[id], m = MARKETS[id];
      if (!q || !m) continue;
      const v = m.value(q.price);
      const el = h('div', 'mk');
      el.append(h('span', 'n', m.label()), h('span', 'v', dg(v.toLocaleString('en-US', { minimumFractionDigits: m.dp, maximumFractionDigits: m.dp }))));
      if (typeof q.change === 'number') {
        const up = q.change >= 0;
        el.append(h('span', 'd ' + (up ? 'up' : 'down'), (up ? '▲ ' : '▼ ') + dg(Math.abs(q.change).toFixed(2)) + '%'));
      }
      box.append(el);
    }
  }

  // ---------- matches (TheSportsDB, public key; through the proxy in the app, or the server)
  const norm = s => String(s || '').toLowerCase().replace(/\b(al|fc|sc|club|saudi club)\b/g, '').replace(/[^a-z0-9]/g, '');
  const AR_NAMES = Object.fromEntries(Object.entries(DATA.teamsAr).filter(([k]) => k[0] !== '_').map(([k, v]) => [norm(k), v]));
  const teamAr = (id, en) => { const t = S.teams.find(x => x.id === String(id)); return (t && t.ar) || AR_NAMES[norm(en)] || en || ''; };
  const teamName = (id, en) => S.lang === 'ar' ? teamAr(id, en) : (en || '');
  function eventTime(ev) {
    const ts = ev.strTimestamp ? ev.strTimestamp.replace(/\+00:00$/, '') : (ev.dateEvent && ev.strTime ? `${ev.dateEvent}T${ev.strTime}` : null);
    return ts ? new Date(/Z$/.test(ts) ? ts : ts + 'Z') : null;
  }
  async function loadMatches() {
    if (!S.teams.length) { state.matches = {}; renderMatch(); return; }
    let data = null;
    if (S.api) { try { data = await getJSON(`${S.api}/v1/matches?teams=${S.teams.map(t => t.id).join(',')}`, 12000); } catch (e) { data = null; } }
    if (!data && IN_APP) {
      data = {};
      await Promise.all(S.teams.map(async t => {
        try {
          const [n, l] = await Promise.all([
            getJSON(net(`https://www.thesportsdb.com/api/v1/json/123/eventsnext.php?id=${t.id}`)),
            getJSON(net(`https://www.thesportsdb.com/api/v1/json/123/eventslast.php?id=${t.id}`)),
          ]);
          data[t.id] = { next: (n && n.events) || [], last: (l && l.results) || [] };
        } catch (e) { /* skip this team */ }
      }));
    }
    if (data && Object.keys(data).length) { state.matches = data; store.set('matches', data); }
    renderMatch();
    if (S.panel === 'matches') renderCard();
  }
  /** Events of the followed teams: results from the last 20 hours, then upcoming ones, soonest first. */
  function matchList() {
    const seen = new Set(), now = Date.now(), out = [];
    for (const t of S.teams) {
      const d = state.matches[t.id]; if (!d) continue;
      for (const ev of [...(d.last || []), ...(d.next || [])]) {
        if (!ev || seen.has(ev.idEvent)) continue;
        const at = eventTime(ev); if (!at) continue;
        const done = ev.intHomeScore != null && ev.intHomeScore !== '' && /FT|Finished|AET|PEN/i.test(ev.strStatus || 'FT');
        const live = !done && ev.intHomeScore != null && ev.intHomeScore !== '' && now >= at.getTime();
        if (done && now - at.getTime() > 20 * 3600e3) continue;
        if (!done && !live && at.getTime() < now - 3 * 3600e3) continue;
        seen.add(ev.idEvent);
        out.push({ ev, at, done, live });
      }
    }
    return out.sort((a, b) => (b.live - a.live) || (b.done - a.done) || a.at - b.at);
  }
  function whenText(at) {
    const l = local(), e = local(at), diff = daysBetween(l, e);
    const tm = fmtTime(e.h * 60 + e.mi);
    if (diff === 0) return `${T.today} ${tm}`;
    if (diff === 1) return `${T.tomorrow} ${tm}`;
    return `${CAL.day.format(at)} ${tm}`;
  }
  function renderMatch() {
    const box = clear($('match')), list = matchList();
    if (!list.length) return;
    const { ev, at, done, live } = list[0];
    box.append(h('span', '', teamName(ev.idHomeTeam, ev.strHomeTeam)));
    if (done || live) box.append(h('span', 'vs', dg(`${ev.intHomeScore} - ${ev.intAwayScore}`)));
    else box.append(h('span', 'vs', '×'));
    box.append(h('span', '', teamName(ev.idAwayTeam, ev.strAwayTeam)));
    box.append(h('span', live ? 'live' : '', live ? T.live : done ? T.ft : whenText(at)));
  }

  // ---------- new episodes (TVMaze, CORS-friendly)
  async function loadShows() {
    const f = S.shows, days = [];
    for (let i = 0; i < 7; i++) { const l = local(new Date(Date.now() + i * 86400000)); days.push(dayKey(l)); }
    let list = null;
    if (S.api) {
      try { list = await getJSON(`${S.api}/v1/shows?genres=${f.genres.join(',')}&langs=${f.langs.join(',')}&min=${f.minRating}`, 15000); } catch (e) { list = null; }
    }
    if (!list) {
      const seen = new Set(); list = [];
      const all = await Promise.all(days.map(d => getJSON(`https://api.tvmaze.com/schedule/web?date=${d}`).catch(() => [])));
      for (const e of all.flat()) {
        const s = e._embedded && e._embedded.show; if (!s || seen.has(s.id)) continue;
        if (['News', 'Talk Show', 'Sports', 'Game Show'].includes(s.type)) continue;
        const rating = (s.rating && s.rating.average) || 0;
        if (rating < f.minRating) continue;
        if (f.genres.length && !(s.genres || []).some(g => f.genres.includes(g))) continue;
        if (f.langs.length && !f.langs.includes(s.language)) continue;
        seen.add(s.id);
        list.push({ name: s.name, season: e.season, number: e.number, date: e.airdate, rating });
      }
      list.sort((a, b) => b.rating - a.rating).splice(30);
    }
    if (list.length) { state.shows = list; store.set('shows', list); }
    if (S.panel === 'shows') renderCard();
  }

  // ---------- the card beside the clock
  function quoteOfDay() {
    const l = local(), n = Math.floor(Date.UTC(l.y, l.m - 1, l.d) / 86400000);
    if (n % 2 === 0 && DATA.verses.length) {
      const v = DATA.verses[Math.floor(n / 2) % DATA.verses.length];
      return { title: T.verse, quote: v.text, cls: 'quote', src: `${v.surah} · ${dg(v.ayah)}` };
    }
    const x = DATA.hadith[Math.floor(n / 2) % DATA.hadith.length];
    return { title: T.hadith, quote: x.text.replace(/صلى الله عليه و ?سلم/g, 'ﷺ'), cls: 'quote hadith', src: x.source };
  }
  function rowsList(rows, nowIndex) {
    const ul = h('ul', 'rows');
    rows.forEach((r, i) => { const li = h('li', i === nowIndex ? 'now' : ''); li.append(h('span', 'a', r[0]), h('span', 'b', r[1])); ul.append(li); });
    return ul;
  }
  /** Long texts step the font down until the card holds them (never below 70%). */
  function fitCard() {
    const card = $('card'), q = card.querySelector('.quote');
    if (!q) return;
    q.style.fontSize = '';
    const base = parseFloat(getComputedStyle(q).fontSize);
    for (let f = 1; f >= 0.7 && card.scrollHeight > card.clientHeight + 1; f -= 0.05) q.style.fontSize = (base * f) + 'px';
  }

  function renderCard(animate) {
    const card = $('card'), body = $('card-body'), title = $('card-title');
    if (S.panel === 'none') { card.hidden = true; return; }
    card.hidden = false; clear(body);
    if (animate) { body.classList.remove('fade'); void body.offsetWidth; body.classList.add('fade'); }
    if (S.panel === 'verse') {
      const q = quoteOfDay(); title.textContent = q.title;
      body.append(h('div', q.cls, S.digits === 'arab' ? q.quote.replace(/\d+/g, dg) : q.quote), h('div', 'src', q.src));
      fitCard();
    } else if (S.panel === 'prayers') {
      ensureTimes(); title.textContent = T.prayersToday;
      const nx = nextPrayer(), friday = local().wd === 'Fri';
      const rows = ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'].map(k => {
        const iq = k === 'sunrise' || (k === 'dhuhr' && friday) ? '' : `  ·  ${T.iqama} ${fmtTime(state.times[k] + S.iqama[k])}`;
        return [prayerName(k, friday), fmtTime(state.times[k]) + iq];
      });
      body.append(rowsList(rows, nx.tomorrow ? -1 : KEYS.indexOf(nx.key)));
    } else if (S.panel === 'forecast') {
      title.textContent = T.forecast;
      const rows = state.forecast.slice(1, 6).map(f => [CAL.day.format(new Date(f.d + 'T12:00:00Z')), `${T.weather[f.code] || ''}  ${dg(f.hi)}° / ${dg(f.lo)}°`]);
      body.append(rows.length ? rowsList(rows, -1) : h('div', 'empty', T.noData));
    } else if (S.panel === 'matches') {
      title.textContent = T.matches;
      const list = matchList().slice(0, 5).map(({ ev, at, done, live }) => [
        `${teamName(ev.idHomeTeam, ev.strHomeTeam)} ${done || live ? dg(ev.intHomeScore + ' - ' + ev.intAwayScore) : '×'} ${teamName(ev.idAwayTeam, ev.strAwayTeam)}`,
        live ? T.live : done ? T.ft : whenText(at)]);
      body.append(list.length ? rowsList(list, -1) : h('div', 'empty', T.noMatches));
    } else if (S.panel === 'shows') {
      title.textContent = T.shows;
      const per = 5, pages = Math.max(1, Math.ceil(state.shows.length / per)), p = state.page % pages;
      const rows = state.shows.slice(p * per, p * per + per).map(s => [s.name, `S${dg(s.season || 1)}·E${dg(s.number || 1)}  ★${dg((s.rating || 0).toFixed(1))}`]);
      body.append(rows.length ? rowsList(rows, -1) : h('div', 'empty', T.noShows));
    }
  }

  // ---------- photos: four a day out of the set, a new one every 20 minutes
  let photoSlot = -1, layer = 0;
  function photoUrl(f) { return IN_APP ? '/photos/' + f : (window.LUBAN_PHOTO_BASE || 'photos/') + f; }
  function applyPhoto(force) {
    const list = DATA.photos; if (!list.length) return;
    const l = local(), day = Math.floor(Date.UTC(l.y, l.m - 1, l.d) / 86400000);
    const slot = Math.floor((l.h * 60 + l.mi) / 20);
    if (!force && slot === photoSlot) return;
    photoSlot = slot;
    const idx = (day * 4 + (slot % 4)) % list.length, ph = list[idx];
    const img = new Image();
    img.onload = () => {
      const a = $(layer ? 'ph-a' : 'ph-b'), b = $(layer ? 'ph-b' : 'ph-a');
      a.style.backgroundImage = `url("${img.src}")`; a.classList.add('on'); b.classList.remove('on'); layer ^= 1;
      $('credit').textContent = `${S.lang === 'ar' ? ph.place_ar : ph.place_en} · ${T.photo}: ${ph.by}${ph.licence ? ' · ' + ph.licence : ''}`;
    };
    img.src = photoUrl(ph.f);
  }

  // ---------- night dimming, burn-in shift
  function applyNight() {
    ensureTimes();
    const now = minutesNow(), t = state.times;
    const night = S.night && (now >= t.isha + 120 || now < t.fajr - 30);
    document.body.classList.toggle('night', night);
  }
  let shiftStep = 0;
  function shift() {
    const steps = [[0, 0], [6, 4], [-5, 6], [4, -5], [-6, -3]], s = steps[++shiftStep % steps.length];
    document.documentElement.style.setProperty('--shift-x', s[0] + 'px');
    document.documentElement.style.setProperty('--shift-y', s[1] + 'px');
  }
  function drawCrenel() {
    // the stepped merlons of an Omani fort wall (Nizwa, Bahla, Jabrin): a thin wall line, stepped teeth above it
    let d = 'M0 12 L0 10', x = 0;
    while (x + 14 <= 240) {
      d += ` L${x + 2} 10 L${x + 2} 7 L${x + 4} 7 L${x + 4} 4 L${x + 6} 4 L${x + 6} 1 L${x + 8} 1 L${x + 8} 4 L${x + 10} 4 L${x + 10} 7 L${x + 12} 7 L${x + 12} 10 L${x + 20} 10`;
      x += 20;
    }
    $('crenel-path').setAttribute('d', d + ' L240 10 L240 12 Z');
  }

  // ---------- start
  async function start() {
    S = await loadSettings();
    applySettings();
    drawCrenel();
    state.markets = store.get('markets', {});
    state.matches = store.get('matches', {});
    state.shows = store.get('shows', []);
    const wc = store.get('weather:' + P.id, null);
    if (wc) { state.weather = wc.w; state.forecast = wc.f; }
    tickClock(); tickDates(); renderPrayers(); renderChips(); renderWeather(); renderMarkets(); renderMatch(); renderCard(); applyPhoto(true); applyNight();
    document.body.classList.add('ready');

    setInterval(tickClock, 1000);
    setInterval(() => { tickDates(); renderPrayers(); renderChips(); applyNight(); }, 20000);
    setInterval(() => { state.page++; if (['shows', 'prayers', 'matches'].includes(S.panel)) renderCard(S.panel === 'shows'); }, 20000);
    setInterval(applyPhoto, 60000);
    setInterval(shift, 180000);
    loadWeather(); setInterval(loadWeather, 30 * 60000);
    loadMarkets(); setInterval(loadMarkets, 15 * 60000);
    loadMatches(); setInterval(loadMatches, 10 * 60000);
    if (S.panel === 'shows') { loadShows(); setInterval(loadShows, 6 * 3600e3); }
    window.addEventListener('hashchange', () => location.reload());
  }

  window.LubanScreen = { start, fitCard, _state: state };
  start();
})();

</script>
</body>
