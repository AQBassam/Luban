<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>إعدادات لُبان · Luban settings</title>
<style>
@font-face{font-family:Tajawal;font-weight:400;src:url(fonts/tajawal-arabic-400-normal.woff2) format("woff2")}
@font-face{font-family:Tajawal;font-weight:700;src:url(fonts/tajawal-arabic-700-normal.woff2) format("woff2")}
:root{--bg:#F6F2EA;--card:#FFFFFF;--ink:#1D2326;--ink-2:#5B6469;--line:#E4DDD0;--luban:#B9822F;--luban-bg:#F3E4C8;--red:#D52B1E;--green:#1A8F4B;--ok:#1A8F4B;--err:#C0392B}
@media (prefers-color-scheme:dark){:root{--bg:#101518;--card:#182024;--ink:#F2EEE6;--ink-2:#A7B0B4;--line:#2A3438;--luban:#E3B062;--luban-bg:#33291A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Tajawal,system-ui,sans-serif;padding:0 16px 120px}
header{position:sticky;top:0;background:var(--bg);padding:16px 0 10px;z-index:2}
h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.band{width:34px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red) 0 33%,#fff 33% 66%,var(--green) 66%);box-shadow:0 0 0 1px var(--line)}
.sub{color:var(--ink-2);font-size:14px;margin-top:2px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
section h2{margin:0 0 10px;font-size:17px;color:var(--luban)}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--ink-2)}
select,input[type=text],input[type=number],input[type=url]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.row{display:flex;gap:10px}.row>*{flex:1}
.check{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px;min-height:36px}
.check input{width:22px;height:22px;accent-color:var(--luban)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid label{margin:0}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:14px}
.times div{background:var(--luban-bg);border-radius:10px;padding:8px;text-align:center}
.times b{display:block;font-size:17px}
.team{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.team:last-child{border-bottom:0}
.team input{flex:1;min-height:38px}
.team button,.hit button{min-width:44px;min-height:40px}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.hit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
#save{position:fixed;inset-inline:16px;bottom:16px;padding:14px;font-size:17px;font-weight:700;background:var(--luban);color:#1D1407;border:0;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#msg{position:fixed;inset-inline:16px;bottom:80px;text-align:center;font-weight:700;padding:10px;border-radius:12px;display:none}
#msg.ok{display:block;background:var(--ok);color:#fff}#msg.err{display:block;background:var(--err);color:#fff}
.hint{font-size:13px;color:var(--ink-2);margin:6px 0 0}
</style>
</head>
<body>
<header><h1><span class="band"></span><span data-t="title">إعدادات لُبان</span></h1><div class="sub" id="sub"></div></header>

<section>
  <h2 data-t="place">المكان والوقت</h2>
  <label for="city" data-t="city">المدينة</label>
  <select id="city"></select>
  <div id="custom" hidden>
    <div class="row"><div><label data-t="nameAr">الاسم بالعربية</label><input id="c-ar" type="text" maxlength="40"></div>
    <div><label data-t="nameEn">الاسم بالإنجليزية</label><input id="c-en" type="text" maxlength="40" dir="ltr"></div></div>
    <div class="row"><div><label data-t="lat">خط العرض</label><input id="c-lat" type="number" step="0.0001" dir="ltr"></div>
    <div><label data-t="lon">خط الطول</label><input id="c-lon" type="number" step="0.0001" dir="ltr"></div></div>
    <label data-t="tz">المنطقة الزمنية (IANA)</label><input id="c-tz" type="text" dir="ltr" placeholder="Asia/Muscat">
  </div>
  <div class="row">
    <div><label for="lang" data-t="lang">اللغة</label><select id="lang"><option value="ar">العربية</option><option value="en">English</option></select></div>
    <div><label for="digits" data-t="digits">الأرقام</label><select id="digits"><option value="latn">0123</option><option value="arab">٠١٢٣</option></select></div>
  </div>
  <label class="check"><input type="checkbox" id="clock24"><span data-t="clock24">ساعة 24</span></label>
</section>

<section>
  <h2 data-t="prayer">الصلاة</h2>
  <label for="method" data-t="method">طريقة الحساب</label><select id="method"></select>
  <label for="asr" data-t="asr">العصر</label>
  <select id="asr"><option value="standard" data-t="asrStd">الجمهور (ظل المثل)</option><option value="hanafi" data-t="asrHan">الحنفي (ظل المثلين)</option></select>
  <div class="times" id="preview"></div>
  <label data-t="offsets">تعديل بالدقائق (لمطابقة تقويم وزارة الأوقاف)</label>
  <div class="grid" id="offsets"></div>
  <label data-t="iqama">دقائق الإقامة بعد الأذان</label>
  <div class="grid" id="iqama"></div>
  <label for="hijri" data-t="hijri">تعديل التاريخ الهجري</label>
  <select id="hijri"><option value="-2">−2</option><option value="-1">−1</option><option value="0">0</option><option value="1">+1</option><option value="2">+2</option></select>
</section>

<section>
  <h2 data-t="screen">الشاشة</h2>
  <label for="panel" data-t="panel">البطاقة بجانب الساعة</label>
  <select id="panel">
    <option value="verse" data-t="pVerse">آية أو حديث اليوم</option><option value="prayers" data-t="pPrayers">مواقيت اليوم والإقامة</option>
    <option value="forecast" data-t="pForecast">طقس الأيام القادمة</option><option value="matches" data-t="pMatches">مباريات فرقك</option>
    <option value="shows" data-t="pShows">جديد المسلسلات</option><option value="none" data-t="pNone">بدون بطاقة</option>
  </select>
  <label class="check"><input type="checkbox" id="omanDays"><span data-t="omanDays">العيد الوطني وموسم الخريف</span></label>
  <label class="check"><input type="checkbox" id="night"><span data-t="night">تخفيف الإضاءة ليلاً</span></label>
  <label class="check"><input type="checkbox" id="homeCard"><span data-t="homeCard">بطاقة المواقيت في الشاشة الرئيسية</span></label>
  <label data-t="markets">الأسواق</label>
  <div class="grid" id="markets"></div>
</section>

<section>
  <h2 data-t="teams">فرقك</h2>
  <div id="teams"></div>
  <div class="row" style="margin-top:8px"><input id="tq" type="text" data-ph="teamSearch" placeholder="ابحث بالإنجليزية: Oman, Al Seeb…" dir="ltr"><button id="tgo" style="flex:0 0 auto" data-t="search">بحث</button></div>
  <div id="hits"></div>
  <p class="hint" data-t="teamsHint">حتى 10 فرق. الاسم العربي قابل للتعديل كما تحب أن يظهر.</p>
</section>

<section>
  <h2 data-t="shows">المسلسلات</h2>
  <label data-t="genres">الأنواع (فارغ = الكل)</label><div class="grid" id="genres"></div>
  <label for="minRating" data-t="minRating">أدنى تقييم</label>
  <select id="minRating"><option>0</option><option>6</option><option>6.5</option><option>7</option><option>7.5</option><option>8</option></select>
</section>

<section>
  <h2 data-t="advanced">متقدم</h2>
  <label for="api" data-t="api">خادم البيانات (اختياري)</label><input id="api" type="url" dir="ltr" placeholder="https://luban.example.com">
  <label for="channel" data-t="channel">قناة التحديث</label>
  <select id="channel"><option value="stable" data-t="stable">مستقرة</option><option value="canary" data-t="canary">تجريبية (تصل أولاً)</option></select>
</section>

<div id="msg"></div>
<button id="save" data-t="save">حفظ</button>
<!--SCRIPT-->
</body>
</html>
