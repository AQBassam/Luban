<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>لُبان · Luban</title>
<!--STYLE-->
</head>
<body>
<!-- The sea: a chart's rhumb lines running out from the dial, engraved waves, and (optionally) the photos under a veil -->
<div id="bg"><div class="ph" id="ph-a"></div><div class="ph" id="ph-b"></div><div class="veil"></div><div class="waves"></div></div>
<svg id="rhumbs" aria-hidden="true"></svg>

<main id="stage">
  <section id="info">
    <header id="top">
      <div id="place">
        <div class="city" id="city"></div>
        <div class="wx" id="wx"></div>
        <div class="wxd" id="wxd"></div>
      </div>
      <div id="chips"></div>
    </header>

    <div id="clock"><span id="hh"></span><span class="colon">:</span><span id="mm"></span><span id="ampm"></span></div>
    <div id="dates"><span id="wday"></span> <span id="hijri"></span><span class="dot"></span><span id="greg"></span></div>

    <!-- the card holds the chosen panel; with prices chosen it turns to them now and then -->
    <aside id="card" hidden>
      <div class="card-hd" id="card-title"></div>
      <div id="card-body"></div>
    </aside>
  </section>

  <!-- The navigators' star compass as a 24-hour dial: noon at the top, the prayers as bearings on the rim,
       and "now" a lit grain of frankincense whose smoke rises across the chart -->
  <section id="dialbox">
    <div id="dial">
      <svg id="dial-svg" viewBox="-400 -400 800 800" aria-hidden="true"></svg>
      <canvas class="smoke" id="smoke-a" width="300" height="420"></canvas>
      <canvas class="smoke" id="smoke-b" width="300" height="420"></canvas>
      <div id="prayers"></div>
      <div id="next"><div class="nn" id="next-name"></div><div class="nt" id="next-time"></div><div class="nl" id="next-left"></div></div>
    </div>
  </section>
</main>
<div id="credit"></div>
<div id="brand" aria-label="لُبان · Luban"></div>
<!--SCRIPT-->
</body>
</html>
