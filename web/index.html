<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>لُبان · Luban</title>
<!--STYLE-->
</head>
<body>
<div id="bg"><div class="ph" id="ph-a"></div><div class="ph" id="ph-b"></div><div class="veil"></div></div>

<main id="stage">
  <header id="top">
    <div id="place">
      <div class="city" id="city"></div>
      <div class="wx" id="wx"></div>
    </div>
    <div id="chips"></div>
    <div id="markets"></div>
  </header>

  <section id="center">
    <div id="clockbox">
      <div id="clock"><span id="hh"></span><span class="colon">:</span><span id="mm"></span><span id="ampm"></span></div>
      <svg class="crenel" viewBox="0 0 240 12" preserveAspectRatio="none" aria-hidden="true"><path id="crenel-path"/></svg>
      <div id="dates"><span id="greg"></span><span class="dot">•</span><span id="hijri"></span></div>
    </div>
    <aside id="card" hidden>
      <div class="card-hd"><span class="flag" role="img" aria-label="علم سلطنة عُمان"></span><span id="card-title"></span></div>
      <div id="card-body"></div>
    </aside>
  </section>

  <section id="prayers"></section>

  <footer id="foot">
    <div id="match"></div>
    <div id="credit"></div>
  </footer>
</main>
<!--SCRIPT-->
</body>
</html>
